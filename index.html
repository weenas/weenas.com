<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weenas</title>
  <meta name="description" content="Weenas 的项目：映湾 CastBay 等。">
  <meta name="theme-color" content="#061B3C">
  <meta property="og:title" content="Weenas">
  <meta property="og:description" content="Projects by Weenas, including CastBay.">
  <meta property="og:url" content="https://weenas.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://weenas.com/brand-assets/png/weenas-app-icon-square-1024.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="Weenas logo: a symmetric W in navy and blue">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://weenas.com/brand-assets/png/weenas-app-icon-square-1024.png">
  <meta name="twitter:image:alt" content="Weenas logo: a symmetric W in navy and blue">
  <link rel="canonical" href="https://weenas.com/">
  <link rel="icon" href="brand-assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" href="brand-assets/svg/weenas-app-icon.svg" type="image/svg+xml">
  <link rel="icon" href="brand-assets/favicon/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="brand-assets/favicon/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="brand-assets/favicon/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="brand-assets/favicon/site.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="brand" aria-label="Weenas">
        <picture>
          <source srcset="brand-assets/svg/weenas-symbol-reverse.svg" media="(prefers-color-scheme: dark)">
          <img class="brand-icon" src="brand-assets/svg/weenas-symbol.svg" alt="" width="38" height="32">
        </picture>
        <span>Weenas</span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#projects" data-i18n="nav.projects"></a>
        <a class="github-link" href="https://github.com/weenas">GitHub</a>
      </nav>

      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Language / 语言">English</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <picture>
          <source srcset="brand-assets/svg/weenas-logo-stacked-reverse.svg" media="(prefers-color-scheme: dark)">
          <img class="hero-logo" src="brand-assets/svg/weenas-logo-stacked.svg" alt="Weenas" width="800" height="640" fetchpriority="high">
        </picture>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.subtitle"></p>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="container">
        <h2 class="visually-hidden" data-i18n="projects.title"></h2>
        <div class="projects" id="project-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Weenas. <span data-i18n="footer.rights"></span></p>
      <a href="https://github.com/weenas">GitHub</a>
    </div>
  </footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
